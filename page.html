div>\n\n      <div class=\"act\">\n        <span class=\"lab\">CONCEPT SINGLE</span>\n        <h4>\u300eyummy!!\u300f</h4>\n        <p class=\"dt\" style=\"font-size:12.5px;color:var(--pink-d);font-weight:700\">2024\u5e749\u670825\u65e5 \u30ea\u30ea\u30fc\u30b9 \uff0f \u30a4\u30f3\u30da\u30ea\u30a2\u30eb\u30ec\u30b3\u30fc\u30c9</p>\n        <p>\u300c\u30aa\u30e2\u30a4\u30aa\u30f3\u30ca\u30ce\u30b3\u300d\u3092\u30c6\u30fc\u30de\u306b\u3057\u305f\u30b3\u30f3\u30bb\u30d7\u30c8\u30fb\u30b7\u30f3\u30b0\u30eb\u3002<br>\u53ce\u9332\u66f2\uff1a\u300e\u63a8\u2252\u604b\u300f\u300e\u7d50\u3073\u76ee\u300f\u300e\u30de\u30ea\u30aa\u30cd\u30c3\u30c8\u30ac\u30fc\u30eb\u300f</p>\n      </div>\n\n      <div class=\"act\">\n        <span class=\"lab\">MAJOR 2ND SINGLE</span>\n        <h4>\u300eOvernight Rainbow\u300f</h4>\n        <p class=\"dt\" style=\"font-size:12.5px;color:var(--pink-d);font-weight:700\">2024\u5e743\u670820\u65e5 \u30ea\u30ea\u30fc\u30b9 \uff0f \u30a4\u30f3\u30da\u30ea\u30a2\u30eb\u30ec\u30b3\u30fc\u30c9</p>\n        <p>7\u4eba\u4f53\u5236\u521d\u306e\u30e1\u30b8\u30e3\u30fc2nd\u30b7\u30f3\u30b0\u30eb\u3002<br>\u53ce\u9332\u66f2\uff1a\u300eOvernight Rainbow\u300f\u300e\u900f\u660e\u300f</p>\n      </div>\n\n      <div class=\"act\">\n        <span class=\"lab\">MAJOR 1ST SINGLE</span>\n        <h4>\u300ewonder little love\u300f</h4>\n        <p class=\"dt\" style=\"font-size:12.5px;color:var(--pink-d);font-weight:700\">2023\u5e746\u670821\u65e5 \u30ea\u30ea\u30fc\u30b9 \uff0f \u30a4\u30f3\u30da\u30ea\u30a2\u30eb\u30ec\u30b3\u30fc\u30c9</p>\n        <p>\u30e1\u30b8\u30e3\u30fc1st\u30b7\u30f3\u30b0\u30eb\u3002<br>\u53ce\u9332\u66f2\uff1a\u300ewonder little love\u300f\u300eTAiLWiND\u300f\u300eGlow-up-Days\u300f</p>\n      </div>\n\n      <div class=\"act\">\n        <span class=\"lab\">1ST SINGLE</span>\n        <h4>\u300e\u604b\u3001\u3044\u3061\u3070\u3093\u3081\u300f</h4>\n        <p class=\"dt\" style=\"font-size:12.5px;color:var(--pink-d);font-weight:700\">202     <h3>りななのの魅力</h3>
    <p>ファン目線で挙げるなら、やっぱりこの3つ。2人だからこそ生まれる化学反応です。</p>
    <ol class=\"charm\">
      <li><b>アコースティックギター弾き語りと歌って踊るステージの二刀流</b><br>『POP GALAXY 2026』で見せた2人でのアコギ弾き語りから、『ながいきフェスタ in 桃神祭』で初披露してファンを驚かせた歌って踊るパフォーマンスまで、ステージごとに新鮮な表情を見せてくれます。</li>
      <li><b>まっすぐで力強い歌声×透明感あふれる歌声のハーモニー</b><br>結城りなの芯のある明るいボーカルと、青山菜花の伸びやかで澄んだ歌声が重なることで、カバー曲でもオリジナル曲でも耳に残る心地よいハーモニーが生まれます。</li>
      <li><b>舞台・朗読劇・配信でも息ぴったりの姉妹のような関係性</b><br>『アイディール・セミナー』や『コトバノコトバ』などの朗読劇、料理配信や特典会まで、どの現場でも自然体で笑い合う2人の温かい空気感がそのままステージの魅力につながっています。</li>
